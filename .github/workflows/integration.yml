name: CI/CD Integration Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Stable Rust (for workspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Nightly Rust (for eBPF compilation)
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Mount BPF filesystem
        run: sudo mount -t bpf none /sys/fs/bpf || true

      - name: Install bpf-linker
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: bpf-linker

      - name: Generate Team Keypair for CI
        run: |
          if [ ! -f id_rsa ]; then
            ssh-keygen -t ed25519 -N "" -f id_rsa -C "ci-test-key"
          fi

      - name: Build Crystal Hammer Binaries
        run: make build-all

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/integration/requirements.txt

      - name: Run Integration Tests
        run: pytest tests/integration -v