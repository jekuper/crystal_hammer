name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"        # nightly: catches breakage from refreshed distro images
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build once. The binaries are static musl, so the same artifact is what we
  # ship and what every VM tests.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Stable Rust (for workspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install nightly (eBPF)
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install bpf-linker
        run: |
          curl -fsSL -o bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          mkdir -p "$HOME/.local/bin"
          tar -xpf bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate throwaway CI keypair
        run: |
          [ -f id_rsa ] || ssh-keygen -t ed25519 -N "" -f id_rsa -C "ci-test-key"

      - name: Build
        run: make build-all

      - name: Stage artifacts
        run: |
          mkdir ci-bin
          cp target/agent target/client id_rsa ci-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: ch-binaries
          path: ci-bin/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Real distros with their stock kernels, init systems, and security
  # defaults. One job = one VM; all tests run against it; jobs run in parallel.
  # "latest" URLs move; if one 404s, grab the current filename from its index.
  # ---------------------------------------------------------------------------
  distros:
    name: distro ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          - name: ubuntu-24.04
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - name: debian-12
            url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
          - name: rocky-9           # "5.14" with years of RHEL backports
            url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud.latest.x86_64.qcow2
          - name: opensuse-leap-15.6
            url: https://download.opensuse.org/distribution/leap/15.6/appliances/openSUSE-Leap-15.6-Minimal-VM.x86_64-Cloud.qcow2
          - name: opensuse-tumbleweed
            url: https://download.opensuse.org/tumbleweed/appliances/openSUSE-Tumbleweed-Minimal-VM.x86_64-Cloud.qcow2
          - name: alpine            # bump version as releases move
            url: https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/cloud/nocloud_alpine-3.21.2-x86_64-bios-cloudinit-r0.qcow2
            pkgs: iproute2 util-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ch-binaries
          path: ci-bin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache cloud image (refreshed weekly)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ch-vm/${{ matrix.name }}.img
          key: vmimg-${{ matrix.name }}-${{ steps.week.outputs.w }}

      - name: Boot ${{ matrix.name }}
        run: bash tests/integration/vm/boot_cloud_image.sh "${{ matrix.name }}" "${{ matrix.url }}" "${{ matrix.pkgs }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - name: Run integration tests
        env:
          CH_TARGET: ssh://root@127.0.0.1:2200
          CH_SSH_KEY: /tmp/ch-vm/key
          CH_BIN_DIR: ci-bin
        run: pytest tests/integration -v

      - name: VM console log
        if: failure()
        run: tail -n 200 /tmp/ch-vm/console.log || true